<!doctype html>
<title>Radar de Pendências</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #f2f4f2;
    --surface: #ffffff;
    --surface-2: #eaece9;
    --border: #dbdfda;
    --text: #1a211e;
    --muted: #5d6660;
    --accent: #ff5a1f;
    --accent-ink: #ffffff;
    --ok: #2f9e63;
    --ok-bg: #e5f5ec;
    --warn: #b9790f;
    --warn-bg: #fbf1dd;
    --crit: #c53d1f;
    --crit-bg: #fbe7e0;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 8px 24px -12px rgba(20, 30, 25, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17;
      --surface: #1c2420;
      --surface-2: #232c27;
      --border: #313c35;
      --text: #ecf1ee;
      --muted: #9aa79f;
      --accent: #ff7a45;
      --accent-ink: #1a0e08;
      --ok: #5fd996;
      --ok-bg: #16332338;
      --warn: #f0b955;
      --warn-bg: #3a2c1038;
      --crit: #ff8266;
      --crit-bg: #3a1a1038;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17;
    --surface: #1c2420;
    --surface-2: #232c27;
    --border: #313c35;
    --text: #ecf1ee;
    --muted: #9aa79f;
    --accent: #ff7a45;
    --accent-ink: #1a0e08;
    --ok: #5fd996;
    --ok-bg: #16332338;
    --warn: #f0b955;
    --warn-bg: #3a2c1038;
    --crit: #ff8266;
    --crit-bg: #3a1a1038;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 28px 20px 64px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    text-wrap: balance;
  }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .updated {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  button.icon-btn, button.ghost-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.icon-btn:hover, button.ghost-btn:hover { border-color: var(--accent); }
  button.icon-btn:focus-visible, button.ghost-btn:focus-visible,
  .filter-tile:focus-visible, .resolve-btn:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 10px;
    margin-bottom: 26px;
  }
  .filter-tile {
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .filter-tile:hover { border-color: var(--accent); }
  .filter-tile[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .filter-tile .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .filter-tile .label {
    font-size: 12px;
    color: var(--muted);
  }
  .filter-tile.all .count { color: var(--accent); }

  .section-heading {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 26px 0 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .section-heading .n {
    background: var(--surface-2);
    border-radius: 999px;
    padding: 1px 8px;
    font-weight: 600;
  }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 14px;
    align-items: flex-start;
    justify-content: space-between;
  }
  .card-main { min-width: 0; flex: 1; }
  .card-title { font-weight: 600; font-size: 15px; margin: 0 0 4px; text-wrap: balance; }
  .card-detail {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--text);
    opacity: 0.9;
    overflow-wrap: break-word;
    max-width: 65ch;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 999px;
    padding: 2px 9px;
    background: var(--warn-bg);
    color: var(--warn);
    white-space: nowrap;
  }
  .card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .resolve-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--ok);
    background: var(--ok-bg);
    color: var(--ok);
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .resolve-btn:hover { filter: brightness(1.05); }
  .resolve-btn:disabled { opacity: 0.5; cursor: default; }

  .empty, .state-msg {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty .big { font-size: 32px; margin-bottom: 6px; }
  .state-msg.error { border-color: var(--crit); color: var(--crit); background: var(--crit-bg); }

  .key-form {
    max-width: 420px;
    margin: 60px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .key-form p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .key-form input {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin: 10px 0 14px;
  }
  .key-form button {
    font-family: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
  }

  [hidden] { display: none !important; }

  @media (max-width: 520px) {
    .card { flex-direction: column; }
    .card-side { flex-direction: row-reverse; align-items: center; width: 100%; justify-content: space-between; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div>
      <p class="eyebrow">Radar Climbeiros</p>
      <h1>Pendências de aprovação</h1>
    </div>
    <div class="topbar-actions">
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh-btn" type="button">↻ Atualizar</button>
    </div>
  </div>

  <div id="key-gate" class="key-form" hidden>
    <p class="eyebrow" style="margin-bottom:10px;">Acesso</p>
    <p>Esse painel lê direto do Supabase por uma chave própria do endpoint. Cole a chave de acesso pra continuar (fica salva só neste navegador).</p>
    <input id="key-input" type="text" placeholder="chave de acesso" autocomplete="off" />
    <button id="key-submit" type="button">Entrar</button>
  </div>

  <div id="app" hidden>
    <div class="tiles" id="tiles"></div>
    <div id="list-area"></div>
  </div>

  <div id="state-msg" class="state-msg" hidden></div>
</div>

<script>
(function () {
  const FUNCTION_URL = "https://ctbetvnlojkpiwrruvie.supabase.co/functions/v1/pendencias-dashboard";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0YmV0dm5sb2prcGl3cnJ1dmllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzIwMjgsImV4cCI6MjEwMDg0ODAyOH0.CfPiDPGUVn0KXwLMZBWdU-kTCDAqtuZvTeWAxCs_RKg";
  // Este arquivo é local (só seu) — por isso a chave já vem preenchida aqui.
  const DEFAULT_KEY = "8e0f371c8449402de1e29b7fbad314670c0690d73a4c85e9";

  const LABELS = {
    avaliacao_academia: "Avaliação de academia",
    avaliacao_setor: "Avaliação de setor",
    foto_avaliacao_setor: "Foto de avaliação",
    foto_galeria: "Foto da galeria",
    cadastro_guia: "Cadastro de guia",
    cadastro_parceiro: "Cadastro de parceiro",
    cadastro_hospedagem: "Cadastro de hospedagem",
    mensagem_contato: "Mensagem de contato",
    feedback: "Feedback do site",
  };

  const els = {
    keyGate: document.getElementById("key-gate"),
    keyInput: document.getElementById("key-input"),
    keySubmit: document.getElementById("key-submit"),
    app: document.getElementById("app"),
    tiles: document.getElementById("tiles"),
    listArea: document.getElementById("list-area"),
    stateMsg: document.getElementById("state-msg"),
    updated: document.getElementById("updated"),
    refreshBtn: document.getElementById("refresh-btn"),
  };

  let activeFilter = "all";
  let currentItens = [];
  let currentResumo = [];

  function getKey() {
    try {
      const url = new URL(window.location.href);
      const fromUrl = url.searchParams.get("key");
      if (fromUrl) {
        localStorage.setItem("pendencias_key", fromUrl);
        return fromUrl;
      }
      return localStorage.getItem("pendencias_key") || DEFAULT_KEY;
    } catch (e) {
      return DEFAULT_KEY;
    }
  }

  function setKey(k) {
    try { localStorage.setItem("pendencias_key", k); } catch (e) {}
  }

  function relTime(iso) {
    const d = new Date(iso);
    const diffMs = Date.now() - d.getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "agora";
    if (mins < 60) return mins + " min atrás";
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours + "h atrás";
    const days = Math.round(hours / 24);
    if (days < 30) return days + "d atrás";
    return d.toLocaleDateString("pt-BR");
  }

  function showState(msg, isError) {
    els.stateMsg.hidden = false;
    els.stateMsg.textContent = msg;
    els.stateMsg.className = "state-msg" + (isError ? " error" : "");
  }
  function hideState() {
    els.stateMsg.hidden = true;
  }

  async function api(path, options) {
    const key = getKey();
    const sep = path.includes("?") ? "&" : "?";
    const res = await fetch(FUNCTION_URL + sep + "key=" + encodeURIComponent(key), Object.assign({
      headers: Object.assign({
        "Authorization": "Bearer " + ANON_KEY,
        "apikey": ANON_KEY,
        "Content-Type": "application/json",
      }, (options && options.headers) || {}),
    }, options || {}));
    if (res.status === 401) {
      throw Object.assign(new Error("unauthorized"), { code: 401 });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "erro desconhecido");
    return data;
  }

  function renderTiles() {
    const total = currentItens.length;
    const tilesHtml = [
      '<button class="filter-tile all" data-filter="all" aria-pressed="' + (activeFilter === "all") + '">' +
        '<span class="count">' + total + '</span><span class="label">Tudo</span></button>'
    ];
    currentResumo
      .slice()
      .sort((a, b) => b.total - a.total)
      .forEach(function (r) {
        tilesHtml.push(
          '<button class="filter-tile" data-filter="' + r.origem + '" aria-pressed="' + (activeFilter === r.origem) + '">' +
            '<span class="count">' + r.total + '</span><span class="label">' + (LABELS[r.origem] || r.origem) + '</span></button>'
        );
      });
    els.tiles.innerHTML = tilesHtml.join("");
    els.tiles.querySelectorAll(".filter-tile").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeFilter = btn.getAttribute("data-filter");
        renderTiles();
        renderList();
      });
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderList() {
    const items = activeFilter === "all"
      ? currentItens
      : currentItens.filter(function (i) { return i.origem === activeFilter; });

    if (items.length === 0) {
      els.listArea.innerHTML = '<div class="empty"><div class="big">✓</div>Nada pendente por aqui.<br>Tudo revisado.</div>';
      return;
    }

    els.listArea.innerHTML =
      '<div class="section-heading">Aguardando revisão <span class="n">' + items.length + '</span></div>' +
      '<div class="card-list">' +
      items.map(function (item) {
        return (
          '<div class="card" data-id="' + escapeHtml(item.id) + '" data-origem="' + escapeHtml(item.origem) + '">' +
            '<div class="card-main">' +
              '<p class="card-title">' + escapeHtml(item.titulo) + '</p>' +
              (item.detalhe ? '<p class="card-detail">' + escapeHtml(item.detalhe) + '</p>' : '') +
              '<div class="card-meta">' +
                '<span class="badge">' + escapeHtml(LABELS[item.origem] || item.origem) + '</span>' +
                (item.contato ? '<span>' + escapeHtml(item.contato) + '</span>' : '') +
                '<span>' + relTime(item.enviado_em) + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="card-side">' +
              '<button class="resolve-btn" type="button">Marcar como resolvido</button>' +
            '</div>' +
          '</div>'
        );
      }).join("") +
      '</div>';

    els.listArea.querySelectorAll(".resolve-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const card = btn.closest(".card");
        resolveItem(card.getAttribute("data-origem"), card.getAttribute("data-id"), btn, card);
      });
    });
  }

  async function resolveItem(origem, id, btn, card) {
    btn.disabled = true;
    btn.textContent = "Marcando…";
    try {
      await api("", {
        method: "POST",
        body: JSON.stringify({ origem: origem, id: id }),
      });
      currentItens = currentItens.filter(function (i) { return !(i.origem === origem && i.id === id); });
      currentResumo = currentResumo
        .map(function (r) { return r.origem === origem ? Object.assign({}, r, { total: Math.max(0, r.total - 1) }) : r; })
        .filter(function (r) { return r.total > 0; });
      card.style.opacity = "0";
      setTimeout(function () {
        renderTiles();
        renderList();
      }, 120);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Marcar como resolvido";
      showState("Não consegui marcar como resolvido: " + e.message, true);
    }
  }

  async function load() {
    hideState();
    els.refreshBtn.disabled = true;
    try {
      const data = await api("");
      els.keyGate.hidden = true;
      els.app.hidden = false;
      currentItens = data.itens || [];
      currentResumo = data.resumo || [];
      els.updated.textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR");
      renderTiles();
      renderList();
    } catch (e) {
      if (e.code === 401) {
        els.app.hidden = true;
        els.keyGate.hidden = false;
      } else {
        showState("Não consegui carregar as pendências: " + e.message, true);
      }
    } finally {
      els.refreshBtn.disabled = false;
    }
  }

  els.refreshBtn.addEventListener("click", load);
  els.keySubmit.addEventListener("click", function () {
    const v = els.keyInput.value.trim();
    if (v) { setKey(v); load(); }
  });
  els.keyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") els.keySubmit.click();
  });

  load();
  setInterval(load, 60000);
})();
</script>
